<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b3b3c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pump Log">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Daily Pump Operation</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ease-out:cubic-bezier(0.23,1,0.32,1);--bg:#eaf2f1;--surface:#fff;--field:#f1f6f5;--ink:#12302f;--muted:#587270;--line:#dbe6e4;--water:#0b7a8a;--onwater:#fff;--ok:#2e7d32;--off:#b4501f;--offbg:#f7e4db;--sol:#e29a0c;--leaf:#4f8f2f;--wave:#0b3b3c;--wave2:#0f6f7c;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1819;--surface:#132527;--field:#0e1d1f;--ink:#e4f0ee;--muted:#8fa9a7;--line:#23403f;--water:#52c2d1;--onwater:#06262c;--ok:#8fd18f;--off:#f0a07d;--offbg:#40241a;--sol:#f0b43a;--leaf:#8cc66a;--wave:#071f21;--wave2:#0c4a52}}
:root[data-theme="dark"]{--bg:#0b1819;--surface:#132527;--field:#0e1d1f;--ink:#e4f0ee;--muted:#8fa9a7;--line:#23403f;--water:#52c2d1;--onwater:#06262c;--ok:#8fd18f;--off:#f0a07d;--offbg:#40241a;--sol:#f0b43a;--leaf:#8cc66a;--wave:#071f21;--wave2:#0c4a52}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:14px 14px 96px}
h1{font-size:1.35rem;margin:4px 0 2px}
.sub{color:var(--muted);margin:0 0 14px;font-size:.92rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--water);outline-offset:1px}
input[type=range]{padding:0;min-height:36px;accent-color:var(--water)}
.row{display:flex;gap:8px;align-items:flex-end}
.row>div{flex:1;min-width:0}
button{min-height:44px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
button:disabled{opacity:.5}
button.pri{background:var(--water);color:var(--onwater);border-color:var(--water);font-weight:700}
button.sm{padding:8px 10px;white-space:nowrap}
button.dng{color:var(--off);margin-top:10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg label{flex:1;margin:0;position:relative;color:var(--ink)}
.seg input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;padding:0;border:0;margin:0}
.seg span{display:block;text-align:center;padding:11px 8px;min-height:44px}
.seg input:checked+span{background:var(--water);color:var(--onwater);font-weight:700}
.seg input:focus-visible+span{outline:2px solid var(--ink);outline-offset:-4px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.stat b{display:block;font-size:1.3rem}
.stat span{font-size:.82rem;color:var(--muted)}
.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
.day.run{border-left:5px solid var(--ok)}
.day.off{border-left:5px solid var(--off)}
.dh{display:flex;width:100%;align-items:center;gap:8px;border:0;border-radius:0;background:none;text-align:left;min-height:52px}
.dn{font-weight:700;min-width:64px}
.ds{flex:1;color:var(--muted);font-size:.92rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day.run .ds{color:var(--ok);font-weight:700}
.day.off .ds{color:var(--off)}
.tag{font-size:.75rem;border:1px solid var(--water);color:var(--water);border-radius:6px;padding:0 6px}
.ed{padding:4px 12px 12px;border-top:1px solid var(--line)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pair .t{display:flex;gap:4px}
.pair .t button{padding:0 8px;font-size:.85rem}
.pl{grid-column:1/-1;font-size:.85rem;color:var(--muted);margin:0}
.ed .f{margin-top:10px}
.err{color:var(--off);background:var(--offbg);border-radius:8px;padding:8px 10px;margin:10px 0 0;font-size:.92rem}
.actions{display:flex;gap:8px;margin-top:12px}
.actions button{flex:1}
.chip{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;min-height:44px;color:var(--ink);font-size:.92rem}
.chip input{width:20px;min-height:20px}
.sp{justify-content:space-between;align-items:center}
.h2{font-size:1.15rem;margin:4px 0 10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.ch{font-size:.7rem;color:var(--muted);text-align:center}
.cc{min-height:46px;border-radius:8px;border:1px solid var(--line);padding:3px 4px;font-size:.68rem;line-height:1.2;overflow:hidden}
.cc b{display:block;font-size:.85rem}
.cc.run{background:color-mix(in srgb,var(--ok) 20%,transparent);border-color:var(--ok)}
.cc.off{background:color-mix(in srgb,var(--off) 18%,transparent);border-color:var(--off)}
.cc.empty{border-style:dashed;border-color:var(--muted)}
.cc.future{opacity:.4}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--muted);margin-top:10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pbr{height:10px;border-radius:5px;margin-top:4px}
.ct{display:block;margin-bottom:8px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:0 0 env(safe-area-inset-bottom,0px)}
.tabs div{display:flex;max-width:560px;margin:0 auto}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;border-radius:0;background:none;font-size:.78rem;color:var(--muted)}
.tabs button[aria-current=true]{color:var(--water);font-weight:700}
.tabs svg{display:block}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:14px;min-height:100px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.card svg{color:var(--water);margin-bottom:4px}
.card span{font-size:.82rem;color:var(--muted)}
.crow{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:6px;align-items:center;margin-top:6px}
.crow span{font-size:.92rem}
.crow label{margin:0;font-size:.75rem}
.kv{padding:6px 0;border-top:1px solid var(--line);font-size:.95rem}
.kv span{display:block;font-size:.8rem;color:var(--muted)}
.ut{width:100%;border-collapse:collapse;table-layout:fixed;font:11px/1.25 Arial,sans-serif;color:#000}
.ut td{padding:2px 3px;height:6mm;vertical-align:middle;word-break:normal;overflow-wrap:break-word;hyphens:none}
.ut .tt{white-space:nowrap;font-size:12px}
.ut .hd{font-size:10px;line-height:1.3}
.ut .b{border:1px solid #000}
.ut .bd{font-weight:700}
.ut .ct{text-align:center}
.ut .bot{vertical-align:bottom}
.dg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dc{position:relative;margin:0}
.dc input{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;padding:0;border:0;margin:0}
.dc span{display:block;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:8px;font-size:.9rem;color:var(--ink)}
.dc input:checked+span{background:var(--off);border-color:var(--off);color:var(--bg);font-weight:700}
.dc input:focus-visible+span{outline:2px solid var(--water);outline-offset:1px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.wk button{padding:8px 0;min-height:40px;font-size:.82rem}
button[aria-pressed=true]{background:var(--off);border-color:var(--off);color:var(--bg);font-weight:700}
.prow{display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:20px;padding:14px 16px;font-weight:400}
.prow b{display:block;font-weight:700}
.prow .note{display:block;margin:2px 0 0}
.prow>span:last-child{margin-left:auto;color:var(--muted);font-size:1.4rem}
.tabs button{font-size:.7rem;padding:8px 2px}
.sn{display:block;font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:1.08rem;font-weight:700;letter-spacing:-.01em}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tg{font-size:.78rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--field);color:var(--ink)}
.tg.sol{background:color-mix(in srgb,var(--sol) 22%,transparent)}
.tg.el{background:color-mix(in srgb,var(--water) 15%,transparent)}
.pts{margin:8px 0 0;font-size:.85rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wxd{display:flex;gap:6px}
.wd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;min-height:88px;border-radius:999px;border:0;background:var(--field);color:var(--ink);font-weight:500}
.wd small{font-size:.68rem;color:var(--muted)}
.wd b{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:1rem}
.wd .wi{height:22px;display:grid;place-items:center;color:var(--muted)}
.wd .wi.sunny{color:var(--sol)}
.wd .wi.rainy{color:var(--water)}
.wd.today{box-shadow:inset 0 0 0 1.5px var(--water)}
.wd[aria-current=true]{background:var(--water);color:var(--onwater)}
.wd[aria-current=true] small,.wd[aria-current=true] .wi{color:inherit}
.wd[aria-current=true] small{opacity:.85}
.wdot{width:14px;height:14px;border-radius:50%;border:1.5px dashed currentColor;opacity:.55}
.wi.pop{animation:pop .18s var(--ease-out)}
.wcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wc{min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0;border-radius:16px;border:0;background:var(--field);color:var(--ink);font-weight:600}
.wc b{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:.95rem}
.wc .wi{height:20px;display:grid;place-items:center;color:var(--muted)}
.wc .wi.sunny{color:var(--sol)}
.wc .wi.rainy{color:var(--water)}
.wc.today{box-shadow:inset 0 0 0 1.5px var(--water)}
.wc[aria-current=true]{background:var(--water);color:var(--onwater)}
.wc[aria-current=true] .wi{color:inherit}
.wc:disabled{opacity:.35}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
textarea{width:100%;min-height:150px;font:inherit;color:inherit;padding:12px;border:1.5px solid transparent;border-radius:12px;background:var(--field);resize:vertical;transition:border-color .15s,box-shadow .15s}
textarea:focus{outline:none;border-color:var(--water);box-shadow:0 0 0 3px color-mix(in srgb,var(--water) 22%,transparent)}
.chk2{display:flex;align-items:center;gap:10px;margin-top:12px;color:var(--ink);font-size:1rem}
.chk2 input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--water)}
.nt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:0;border-radius:20px;padding:14px 16px;margin-bottom:10px;font-weight:400}
.ntx{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word;font-size:.98rem;line-height:1.4}
.ntm{display:block;margin-top:8px;font-size:.78rem;color:var(--muted)}
.nt .pin{float:right;margin-left:8px;color:var(--sol)}
.bcard{padding:0;overflow:hidden;margin-bottom:10px}
.bmain{display:block;width:100%;text-align:left;background:none;color:var(--ink);border:0;border-radius:0;padding:14px 16px;font-weight:400}
.bsub{display:block;margin-top:2px;font-size:.85rem;color:var(--muted)}
.bcr{display:block;margin-top:8px;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bact{display:flex;border-top:1px solid var(--line)}
.bl{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px;text-decoration:none;color:var(--water);font-weight:600;font-size:.86rem}
.bl+.bl{border-left:1px solid var(--line)}
.bno{flex:1;text-align:center;padding:12px;font-size:.82rem;color:var(--muted)}
.crow2{display:grid;grid-template-columns:1fr 84px 44px;gap:6px;margin-top:8px;align-items:center}
.crow2 button{padding:0;min-height:48px}
.card[data-go=report]{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;min-height:0;padding:20px 18px;background:var(--water);color:var(--onwater)}
.card[data-go=report] .ic{grid-row:1/3;margin:0;width:54px;height:54px;background:rgba(255,255,255,.2);color:inherit}
.card[data-go=report] b{font-size:1.25rem;align-self:end}
.card[data-go=report] span:not(.ic){color:inherit;opacity:.88;align-self:start}
.card[data-go=bene]{order:4}
.card[data-go=weather]{order:5}
.card[data-go=notes]{order:6}
.card[data-go=report]{padding:32px 20px;min-height:128px;column-gap:16px}
.card[data-go=report] .ic{width:62px;height:62px;border-radius:20px}
.card[data-go=report] b{font-size:1.45rem}
.card[data-go=report] span:not(.ic){font-size:.92rem}
#wxBox{padding:12px 14px}
#wxBox .wxd{margin-top:8px!important;gap:5px}
#wxBox .wd{min-height:56px;padding:5px 2px;gap:0}
#wxBox .wd small{font-size:.62rem}
#wxBox .wd b{font-size:.88rem;line-height:1.2}
#wxBox .wd .wi{height:18px}
#wxBox .wd .wi svg{width:16px;height:16px}
#wxBox .wdot{width:11px;height:11px}
#wxBox .note{margin-top:6px!important;font-size:.78rem}
.card[data-go=report]{background:var(--surface);color:var(--ink)}
.card[data-go=report] .ic{background:color-mix(in srgb,var(--c,var(--water)) 16%,transparent);color:var(--c,var(--water))}
.card[data-go=report] span:not(.ic){color:var(--muted);opacity:1}
#wxBox{background:none;padding:0;border-radius:0}
#wxBox .wd{background:var(--surface)}
.wxt{display:flex;align-items:center;gap:8px;color:var(--ink)}
.wxt b{font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-size:1.02rem}
.wxl{background:none;border:0;color:var(--water);font-weight:600;padding:6px 0 6px 8px;min-height:36px;border-radius:8px}
#wxBox .wxh{margin-bottom:10px;align-items:center}
#wxBox .wxd{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x proximity;margin:0 -14px!important;padding:2px 14px 6px;scrollbar-width:none}
#wxBox .wxd::-webkit-scrollbar{display:none}
#wxBox .wd{flex:0 0 62px;min-height:88px;padding:8px 2px;gap:2px;scroll-snap-align:end}
#wxBox .wd small{font-size:.66rem;text-transform:uppercase;letter-spacing:.04em}
#wxBox .wd b{font-size:1.05rem}
#wxBox .wd .wi{height:22px}
#wxBox .wd .wi svg{width:20px;height:20px}
.crow3{display:grid;grid-template-columns:1fr 40px 40px 40px;gap:6px;margin-top:8px;align-items:center}
.crow3 button{padding:0;min-height:48px}
.dn.rain{background:color-mix(in srgb,var(--water) 14%,transparent);border-radius:12px;padding:3px 4px}
.dwx{display:grid;place-items:center;height:14px;margin-top:2px;color:var(--muted)}
.dwx.sunny{color:var(--sol)}
.dwx.rainy{color:var(--water)}
.lk{display:inline-flex;align-items:center;gap:3px;color:var(--water);font-weight:600;text-decoration:none}
.sheet-wrap{position:fixed;inset:0;z-index:40;visibility:hidden;pointer-events:none;transition:visibility 0s linear .26s}
.sheet-wrap.open{visibility:visible;pointer-events:auto;transition-delay:0s}
.sheet-bd{position:absolute;inset:0;background:rgba(7,28,29,.45);opacity:0;transition:opacity .22s var(--ease-out)}
.sheet-wrap.open .sheet-bd{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:88vh;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 14px calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateY(100%);transition:transform .26s var(--ease-out)}
.sheet-wrap.open .sheet{transform:translateY(0)}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
@media (prefers-reduced-motion:reduce){.sheet{transform:none;opacity:0;transition:opacity .15s}.sheet-wrap.open .sheet{opacity:1}}
.lkb{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:12px;background:color-mix(in srgb,var(--water) 12%,var(--surface));color:var(--water);font-weight:600;font-size:.85rem;text-decoration:none}
.note:empty,.sub:empty{display:none}
.card[data-go=report] b{align-self:center}
.blist .bmain{display:flex;gap:12px;align-items:flex-start;padding:16px}
.bav{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--water) 15%,var(--surface));color:var(--water);font-family:"Bricolage Grotesque","Figtree",system-ui,sans-serif;font-weight:700}
.bbody{display:block;min-width:0;flex:1}
.blist .bact{display:flex;gap:10px;border-top:0;padding:0 16px 16px}
.blist .bl{border:0;min-height:44px;border-radius:999px}
.blist .bl+.bl{border-left:0}
.blist .bl.call{flex:1;background:var(--water);color:var(--onwater)}
.blist .bl.wa{flex:none;width:44px;background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ok)}
.card{position:relative}
.cbadge{position:absolute;top:14px;right:14px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--off);color:var(--bg);font-size:.8rem;font-weight:700;display:grid;place-items:center}
.tks{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--muted);margin:16px 2px 8px;cursor:default}
.tks.over{color:var(--off)}
.tk{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:8px 14px 8px 8px;margin-bottom:8px}
.tkc{flex:none;width:44px;height:44px;padding:0;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;display:grid;place-items:center;transition:background-color .16s var(--ease-out),border-color .16s var(--ease-out),color .16s var(--ease-out)}
.tk.done .tkc{background:var(--ok);border-color:var(--ok);color:var(--onwater)}
.tkc.pop svg{animation:pop .18s var(--ease-out)}
.tkm{flex:1;min-width:0;text-align:left;background:none;border:0;border-radius:10px;color:var(--ink);padding:4px 0;font-weight:400}
.tkt{display:block;font-weight:600;word-break:break-word}
.tk.done .tkt{text-decoration:line-through;color:var(--muted)}
.tkd{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:2px;font-size:.8rem;color:var(--muted)}
.tkd.over{color:var(--off);font-weight:600}
.tkd.today{color:var(--water);font-weight:600}
@media (prefers-reduced-motion:reduce){.tkc.pop svg{animation:none}}
:root[data-accent=mustard]{--water:#946c00;--wave:#3a3003;--wave2:#946c00;--bg:#f2f3e2;--field:#f3f4e6;--line:#e1e4c8;--ink:#262d0d;--muted:#666b4a;--sol:#d98e04}
@media (prefers-color-scheme:dark){:root[data-accent=mustard]:not([data-theme="light"]){--water:#f0c53a;--onwater:#2a2200;--wave:#1c1904;--wave2:#6a5200;--bg:#14170b;--surface:#1e2211;--field:#181b0d;--line:#33381c;--ink:#eef0d6;--muted:#a9ae88}}

<script>
(function(){
var K='dpo.v1',S=null,open=null,draft=null,err='',lastAuto=null;
var DEF={STW:10,MDTW:16,DTW:25,LIS:30,Other:15},SOL_LO=420,SOL_HI=1020;
try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
var d0=new Date();
if(!S||!S.schemes)S={schemes:[],cur:null,pt:null,month:d0.getFullYear()+'-'+String(d0.getMonth()+1).padStart(2,'0'),data:{}};
S.schemes.forEach(function(s){
 if(!s.points){s.points=[{id:s.id,name:'Point 1',type:s.type||'STW',cap:s.cap||DEF[s.type]||15,power:s.solar?'solar':'electric'}];delete s.type;delete s.cap;delete s.solar}
 if(s.type===undefined){var f=s.points[0]||{};s.type=f.type||'STW';s.cap=f.cap||DEF[s.type]||15;s.power=f.power||(f.solar?'solar':'electric');s.uin=f.uin||''}
 s.points=s.points.map(function(p){return{id:p.id,name:p.name,link:p.link||'',co:p.co||''}});
});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if(!S.rv)S.rv={s:null,m:null};
if(!S.ut)S.ut={s:null,m:null};
if(!S.prefs)S.prefs={accent:'teal',mode:'auto',lock:'5'};
if(!S.util)S.util={};
if(!S.org)S.org={sub:'Duliajan Sub Division(Irrigation)Duliajan',div:'Naharkatia Duliajan Division(Irrigation) Naharkatia'};
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
function $(i){return document.getElementById(i)}
function show(i,on){$(i).classList.toggle('hide',!on)}
function curS(){return S.schemes.filter(function(s){return s.id===S.cur})[0]}
function cur(){var s=curS();return s?s.points.filter(function(p){return p.id===S.pt})[0]:undefined}
function solar(){var s=curS();return !!s&&s.power==='solar'}
function key(){return S.pt+'|'+S.month}
function days(){var p=S.month.split('-');return new Date(+p[0],+p[1],0).getDate()}
function blank(){return{t:[['',''],['',''],['','']],r:'',m:''}}
function rec(day,make){
 var k=key();
 if(!S.data[k]){if(!make)return null;S.data[k]={}}
 if(!S.data[k][day]){if(!make)return null;S.data[k][day]=blank()}
 return S.data[k][day];
}
function tm(s){if(!s)return null;var p=s.split(':');return +p[0]*60+ +p[1]}
function tt(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function ap(m){var h=Math.floor(m/60),n=m%60,s=h<12?'am':'pm';h=h%12||12;return h+':'+String(n).padStart(2,'0')+' '+s}
function mins(a,b){var x=tm(a),y=tm(b);return(x===null||y===null)?0:Math.max(0,y-x)}
function dayMins(r){return r?r.t.reduce(function(s,p){return s+mins(p[0],p[1])},0):0}
function vol(m){var s=curS();return s?Math.round(m/60*s.cap*10)/10:0}
function fmt(m){var h=Math.floor(m/60),n=m%60;return h+'h'+(n?' '+n+'m':'')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function monthName(){var p=S.month.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'})}
function say(t){$('msg').textContent=t;toast(t)}
function dropData(pid){Object.keys(S.data).forEach(function(k){if(k.indexOf(pid+'|')===0)delete S.data[k]})}

function bounds(r,k,j){
 var T=r.t,q,b={min:0,max:1439,minWhy:'',maxWhy:'',block:''};
 if(solar()){b.min=SOL_LO;b.max=SOL_HI;b.minWhy=b.maxWhy='Solar pumps can run only between '+ap(SOL_LO)+' and '+ap(SOL_HI)+'.'}
 if(j===0){
  b.max-=1;
  for(q=k-1;q>=0;q--){
   if(T[q][0]||T[q][1]){
    var e=tm(T[q][1]);
    if(e===null)b.block='Enter the To time of Run '+(q+1)+' first.';
    else if(e+1>b.min){b.min=e+1;b.minWhy='Run '+(k+1)+' must start after Run '+(q+1)+' ends at '+ap(e)+'.'}
    break;
   }
  }
  var to=tm(T[k][1]);
  if(to!==null){if(to-1<b.max){b.max=to-1;b.maxWhy='From must be earlier than To ('+ap(to)+').'}}
  else for(q=k+1;q<3;q++){if(T[q][0]){var nf=tm(T[q][0]);if(nf-1<b.max){b.max=nf-1;b.maxWhy='Run '+(k+1)+' must start before Run '+(q+1)+' at '+ap(nf)+'.'}break}}
 }else{
  var f=tm(T[k][0]);
  if(f===null)b.block='Enter the From time of Run '+(k+1)+' first.';
  else if(f+1>b.min){b.min=f+1;b.minWhy='To must be later than From ('+ap(f)+').'}
  for(q=k+1;q<3;q++){if(T[q][0]){var n2=tm(T[q][0]);if(n2-1<b.max){b.max=n2-1;b.maxWhy='Run '+(k+1)+' must end before Run '+(q+1)+' starts at '+ap(n2)+'.'}break}}
 }
 return b;
}
function setTime(k,j,v){
 var r=rec(open,true),q;
 if(!v){
  if(j===0&&r.t[k][1]){err='Clear the To time of Run '+(k+1)+' first.';return false}
  if(j===1)for(q=k+1;q<3;q++)if(r.t[q][0]||r.t[q][1]){err='Clear Run '+(q+1)+' first.';return false}
  r.t[k][j]='';r.a=false;r.sg=false;err='';return true;
 }
 var b=bounds(r,k,j),m=tm(v);
 if(b.block){err=b.block;return false}
 if(m<b.min){err=b.minWhy||'That time is too early.';return false}
 if(m>b.max){err=b.maxWhy||'That time is too late.';return false}
 r.t[k][j]=v;r.a=false;r.sg=false;err='';return true;
}
function summ(day){
 var r=rec(day),m=dayMins(r);
 if(m)return{c:'run',t:fmt(m)+' · '+vol(m)+' m³'};
 if(r&&r.r)return{c:'off',t:'Off: '+r.r};
 return{c:'',t:'Not filled'};
}

function opts(a,sel,lab){return a.map(function(x){return'<option value="'+x.id+'"'+(x.id===sel?' selected':'')+'>'+esc(lab(x))+'</option>'}).join('')}
function fixSel(){
 var sc=curS();
 if(!sc){S.cur=S.schemes.length?S.schemes[0].id:null;sc=curS()}
 if(!sc){S.pt=null;return}
 if(!cur())S.pt=sc.points.length?sc.points[0].id:null;
}
function renderSel(){
 var sc=curS(),pts=sc?sc.points:[],p=cur();
 $('scheme').innerHTML=S.schemes.length?opts(S.schemes,S.cur,function(x){return x.name}):'<option>No scheme yet</option>';
 $('scheme').disabled=!S.schemes.length;
 $('point').innerHTML=pts.length?opts(pts,S.pt,function(x){return x.name}):'<option>No point yet</option>';
 $('point').disabled=!pts.length;$('autoBtn').disabled=!p;show('setupBtn',!p);
 $('info').textContent=p?(sc.uin?'UIN '+sc.uin+' · ':'')+sc.type+' · '+sc.cap+' m³/h · '+(sc.power==='solar'?'Solar, runs '+ap(SOL_LO)+' to '+ap(SOL_HI):'Electric, can run at any time'):'Add a scheme with at least one point to start.';
}
function dayWx(i){return(S.weather||{})[S.month+'-'+String(i).padStart(2,'0')]||''}
function dnHTML(i,dw){var w=dayWx(i);return'<span class="dn'+(w==='rainy'?' rain':'')+'"><b>'+i+'</b><i>'+dw+'</i>'+(w?'<span class="dwx '+w+'" role="img" aria-label="'+w+'">'+wxIcon(w,14)+'</span>':'')+'</span>'}
function renderList(){
 var box=$('list');
 if(!cur()){box.innerHTML='';stats();renderSgBox();return}
 var n=days(),p=S.month.split('-'),h='',gone=[],offs=0;
 for(var i=1;i<=n;i++){
  var r=rec(i),dw=new Date(+p[0],+p[1]-1,i).toLocaleDateString('en-GB',{weekday:'short'});
  if(r&&r.x){gone.push('<button type="button" class="chip" data-restore="'+i+'">'+i+' '+dw+' · Restore</button>');continue}
  if(r&&r.r&&!dayMins(r))offs++;
  var s=summ(i);
  h+='<div class="day '+s.c+'" id="d'+i+'"><button type="button" class="dh" data-open="'+i+'">'+dnHTML(i,dw)+'<span class="ds">'+esc(s.t)+'</span>'+(r&&r.a?'<span class="tag">auto</span>':'')+(r&&r.sg?'<span class="tag">signed</span>':'')+'<span aria-hidden="true">'+(open===i?'▲':'▼')+'</span></button>'+(open===i?editor(i):'')+'</div>';
 }
 if(offs)h='<button type="button" id="rmOff" style="width:100%;margin-bottom:8px">Remove all off days from the sheet ('+offs+')</button>'+h;
 if(gone.length)h+='<div class="panel"><b>Removed dates ('+gone.length+')</b><div style="margin-top:10px">'+gone.join('')+'</div></div>';
 box.innerHTML=h;stats();renderSgBox();
}
function field(r,k,j){
 var b=bounds(r,k,j),at=(!b.block&&b.min<=b.max)?' min="'+tt(b.min)+'" max="'+tt(b.max)+'"':'';
 return'<div><label>'+(j?'To':'From')+'</label><div class="t"><input type="time" aria-label="Run '+(k+1)+(j?' To':' From')+'" data-f="'+k+'.'+j+'" value="'+r.t[k][j]+'"'+at+'><button type="button" data-now="'+k+'.'+j+'">Now</button></div></div>';
}
function editor(i){
 var r=rec(i)||blank(),h='<div class="ed">';
 if(err)h+='<p class="err" role="alert">'+esc(err)+'</p>';
 if(dayWx(i)==='rainy')h+='<p class="note" style="margin:10px 0 0">Rainy day. The pump is usually off.</p>';
 for(var k=0;k<3;k++)h+='<div class="pair"><p class="pl">Run '+(k+1)+'</p>'+field(r,k,0)+field(r,k,1)+'</div>';
 return h+'<div class="f"><label>If pump did not operate, reason</label><input data-f="r" value="'+esc(r.r)+'" placeholder="Reason"></div>'
  +'<div class="f"><label>Remarks</label><input data-f="m" value="'+esc(r.m)+'"></div>'
  +'<div class="actions">'+(r.r&&!dayMins(r)?'':'<button type="button" class="sm" data-setoff="'+i+'">Set as off day</button>')+((!dayMins(r)||r.a)?'<button type="button" class="sm dng" style="margin-top:0" data-removeday="'+i+'">Remove this date</button>':'')+'</div>'
  +(dayMins(r)&&!r.a?'':'')+'</div>';
}
function stats(){
 var n=days(),tmn=0,rn=0,of=0;
 if(cur())for(var i=1;i<=n;i++){var r=rec(i),m=dayMins(r);tmn+=m;if(m)rn++;else if(r&&(r.r||r.x))of++}
 $('sH').textContent=fmt(tmn);$('sR').textContent=rn;$('sO').textContent=of;$('sW').textContent=Math.round(vol(tmn)).toLocaleString('en-IN');
}
var TW=[5.7109375,17.28515625,16.28515625,17,16.5703125,15.28515625,14.85546875,19.85546875,21,22.85546875,18.5703125],PER=15;
function sheetItems(){
 var n=days(),o=[];
 for(var i=1;i<=n;i++){var r=rec(i)||blank();if(!r.x)o.push({d:i,r:r})}
 return o;
}
function renderSheet(){
 var sc=curS(),p=cur(),items=sheetItems(),pages=Math.max(1,Math.ceil(items.length/PER)),tot=TW.reduce(function(a,b){return a+b},0),h='',k,i;
 var cg='<colgroup>'+TW.map(function(w){return'<col style="width:'+(w/tot*100).toFixed(2)+'%">'}).join('')+'</colgroup>';
 var line=p?esc(sc.name)+(sc.uin?' (UIN '+esc(sc.uin)+')':'')+' / '+esc(p.name)+' ('+esc(sc.type)+')':'';

function picker(tpl,shuf){

  if(!shuf)return tpl[(i++)%tpl.length];
  if(!deck.length){deck=tpl.map(function(_,k){return k});for(var j=deck.length-1;j>0;j--){var m=Math.floor(Math.random()*(j+1)),t=deck[j];deck[j]=deck[m];deck[m]=t}}
  return tpl[deck.pop()];

}
function genRuns(runs,lo,hi,vary){
 var sh=vary==='more'?4:2,jt=vary==='more'?2:1,t,o;
 function rn(k){return(Math.floor(Math.random()*(2*k+1))-k)*5}
 function ok(a){var i;for(i=0;i<a.length;i++){if(a[i][0]<lo||a[i][1]>hi||a[i][1]-a[i][0]<10)return false;if(i&&a[i][0]<=a[i-1][1])return false}return true}
 function copy(){return runs.map(function(x){return[x[0],x[1]]})}
 if(vary==='off')return ok(runs)?copy():null;
 for(t=0;t<14;t++){
  var dl=rn(sh);
  o=runs.map(function(x){return[Math.round((x[0]+dl+rn(jt))/5)*5,Math.round((x[1]+dl+rn(jt))/5)*5]});
  if(ok(o))return o;
 }
 return ok(runs)?copy():null;
}

/* SA signature */
function b2u(b){var a=new Uint8Array(b),t='',i;for(i=0;i<a.length;i++)t+=String.fromCharCode(a[i]);return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function u2b(u){var t=atob(u.replace(/-/g,'+').replace(/_/g,'/')),a=new Uint8Array(t.length),i;for(i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a.buffer}
function rnd(n){var a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function bioEnable(){
 try{
  if(!(window.PublicKeyCredential&&navigator.credentials&&navigator.credentials.create))throw new Error('x');
  navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Daily Pump Operation'},user:{id:rnd(16),name:S.profile.name||'user',displayName:S.profile.name||'user'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}})
  .then(function(c){S.profile.cred=b2u(c.rawId);save();renderSettings();toast('Fingerprint turned on','ok')},function(){toast('Fingerprint couldn’t be set up here.','info')});
 }catch(e){toast('Fingerprint isn’t available on this device.','info')}
}
function bioSign(){
 try{
  return navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:u2b(S.profile.cred),transports:['internal']}],userVerification:'required',timeout:60000}})
  .then(function(a){var d=new Uint8Array(a.response.authenticatorData);if(!(d[32]&4))throw new Error('uv');return true});
 }catch(e){return Promise.reject(e)}
}

function loadSign(f){
 if(!f)return;
 if(f.type!=='image/png'){toast('Choose a PNG image.','info');return}
 var rd=new FileReader();
 rd.onload=function(){
  var img=new Image();
  img.onload=function(){
   var k=Math.min(1,420/img.width,170/img.height),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k)),c=document.createElement('canvas');
   c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
   S.sign=c.toDataURL('image/png');S.signDim={w:w,h:h};save();renderSettings();toast('Signature saved','ok');
  };
  img.onerror=function(){toast('That image couldn’t be read.','info')};
  img.src=rd.result;
 };
 rd.readAsDataURL(f);
}
function signCounts(){

 return{tot:tot,sig:sig};
}

/* reminders */
var remQ=[];
function remAt(t){
 if(t.snoozeAt)return t.snoozeAt;
 if(!t.due||t.remind===''||t.remind===undefined)return 0;
 return new Date(t.due+'T'+(t.time||'09:00')+':00').getTime()-(+t.remind)*60000;
}
function nativeNotify(t){
 try{if(window.Notification&&Notification.permission==='granted'&&document.hidden)new Notification('Reminder: '+t.title,{body:tkDue(t),tag:t.id})}catch(e){}
}
function renderRem(){
 var el=$('remBar');
 remQ=remQ.filter(function(id){var t=tkList().filter(function(z){return z.id===id})[0];return t&&!t.done});
 if(!remQ.length){el.classList.remove('on');el.innerHTML='';return}
 var t=tkList().filter(function(z){return z.id===remQ[0]})[0],ph=tkPhone(t),mu=tkMap(t);
 el.innerHTML='<div class="rem"><div class="remt"><b>Reminder'+(remQ.length>1?' · '+remQ.length+' due':'')+'</b><span>'+esc(t.title)+'</span><span class="remd">'+esc(tkDue(t))+'</span></div><div class="reml">'
  +(t.type==='call'&&ph?'<a class="remb" href="tel:+91'+ph+'" aria-label="Call">'+IPH+'</a>':'')
  +(t.type==='visit'&&mu?'<a class="remb" href="'+esc(mu)+'" target="_blank" rel="noopener" aria-label="Open map">'+IPIN+'</a>':'')
  +'<button type="button" class="remb" data-rdone="'+t.id+'">Done</button><button type="button" class="remb" data-rsnz="'+t.id+'" aria-label="Snooze 10 minutes">+10m</button><button type="button" class="remb" data-rx="1" aria-label="Dismiss">✕</button></div></div>';
 el.classList.add('on');
}
function checkReminders(){
 if(!S.tasks)return;
 var now=Date.now(),fired=false;
 tkList().forEach(function(t){
  if(t.done||t.notified)return;
  var at=remAt(t);
  if(!at||at>now)return;
  t.notified=true;t.snoozeAt=0;fired=true;
  if(remQ.indexOf(t.id)<0)remQ.push(t.id);
  nativeNotify(t);
 });
 if(fired){save();tkBadge();if(!$('tkHome').classList.contains('hide'))renderTasks()}
 renderRem();
}

 b.innerHTML=need?'<button type="button" id="ntfAllow" style="width:100%;margin-bottom:12px">Allow notifications for reminders</button>':'';
}
